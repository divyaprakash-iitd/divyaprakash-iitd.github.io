# Checks every link on the built site and writes a report to the run's summary page.
# It only reports: it never fails, so it can't block a pull request or a deploy.
name: Check links

on:
  # Monthly, on the 1st at 03:17 UTC
  schedule:
    - cron: "17 3 1 * *"
  # Run by hand from the Actions tab
  workflow_dispatch:
  # On pull requests, so new or edited pages are checked before merging
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build the site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check links
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          # 403 and 429 usually mean a site blocks automated checks (Google Scholar, publishers), not a dead link.
          # Social "share" buttons are skipped: those sites always refuse automated requests.
          args: >-
            --no-progress
            --max-retries 2
            --timeout 30
            --accept '200..=299,403,429'
            --exclude 'linkedin\.com/shareArticle'
            --exclude 'facebook\.com/sharer'
            --exclude 'x\.com/intent'
            --exclude 'bsky\.app/intent'
            --exclude 'addtoany\.com'
            --exclude 'fonts\.(googleapis|gstatic)\.com'
            './_site/**/*.html'
          format: markdown
          jobSummary: true
          fail: false
      - name: Print the report
        if: always()
        run: cat lychee/out.md || true
