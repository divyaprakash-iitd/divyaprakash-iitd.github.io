<!-- start custom comments snippet -->
{% comment %} The template includes this snippet twice per page; the script loads giscus only once.
   The page HTML is compressed onto one line, so use /* */ comments in the script, never //. {% endcomment %}
{% if site.comments.giscus %}
  <div class="giscus-comments">
    <div class="giscus"></div>
    <script>
      (function () {
        if (window.giscusLoaded) return;
        window.giscusLoaded = true;
        var container = document.currentScript.parentNode;

        /* Match the giscus theme to the site's light/dark toggle */
        function giscusTheme() {
          return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        }

        /* Initial theme, worked out the same way as the site's main script (which may not have run yet) */
        function initialTheme() {
          var stored = null;
          try { stored = localStorage.getItem("theme"); } catch (e) {}
          if (stored === "dark" || stored === "light") return stored;
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        var script = document.createElement("script");
        script.src = "https://giscus.app/client.js";
        script.setAttribute("data-repo", "{{ site.repository }}");
        script.setAttribute("data-repo-id", "{{ site.comments.giscus.repo_id }}");
        script.setAttribute("data-category", "{{ site.comments.giscus.category }}");
        script.setAttribute("data-category-id", "{{ site.comments.giscus.category_id }}");
        script.setAttribute("data-mapping", "pathname");
        script.setAttribute("data-strict", "1");
        script.setAttribute("data-reactions-enabled", "{{ site.comments.giscus.reactions_enabled }}");
        script.setAttribute("data-emit-metadata", "0");
        script.setAttribute("data-input-position", "bottom");
        script.setAttribute("data-theme", initialTheme());
        script.setAttribute("data-lang", "en");
        script.setAttribute("data-loading", "lazy");
        script.crossOrigin = "anonymous";
        script.async = true;
        container.appendChild(script);

        /* Update the embedded comments when the theme is toggled */
        new MutationObserver(function () {
          var frame = document.querySelector("iframe.giscus-frame");
          if (frame) {
            frame.contentWindow.postMessage({ giscus: { setConfig: { theme: giscusTheme() } } }, "https://giscus.app");
          }
        }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      })();
    </script>
  </div>
{% endif %}
<!-- end custom comments snippet -->
